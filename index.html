
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crackers Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 3px 15px #00000012;
    }

    h2 {
      margin-top: 0;
      color: #176b49;
      text-align: center;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #176b49;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      background: #aaa;
    }

    #stopButton {
      background: #777;
    }

    #returnButton {
      background: #176b49;
    }

    .message {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #eef5f1;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .barcode {
      font-size: 23px;
      font-weight: bold;
      color: #176b49;
    }

    .small {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Crackers Barcode Scanner</h2>

    <div id="reader"></div>

    <button id="startButton" onclick="startScanner()">
      Start Rear Camera
    </button>

    <button id="stopButton" onclick="stopScanner()" disabled>
      Stop Scanner
    </button>

    <button id="returnButton" onclick="returnToBilling()">
      ← Return to Agent Billing
    </button>

    <div class="message" id="status">
      Ready. Tap Start Rear Camera.
    </div>

    <div class="message" id="result" style="display:none">
      <div>Last scanned barcode:</div>
      <div class="barcode" id="barcodeValue"></div>
      <div id="sendStatus"></div>
    </div>

    <p class="small">
      Keep the barcode inside the camera scanning area.
      After each successful scan, move the barcode away briefly
      before scanning the next item.
    </p>

    <p class="small">
      Keep your Agent Billing tab open. Scanned items will be
      sent back to that tab.
    </p>
  </div>

  <script>
    let scanner = null;
    let scannerRunning = false;

    // Duplicate scan protection
    let scanLocked = false;
    let lastBarcodeDetectedAt = 0;

    // Unlock only after 1.5 seconds without barcode detection
    const UNLOCK_DELAY_MS = 1500;

    let audioContext = null;

    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");
    const barcodeValue = document.getElementById("barcodeValue");
    const sendStatus = document.getElementById("sendStatus");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function beep() {
      try {
        audioContext = audioContext ||
          new (window.AudioContext || window.webkitAudioContext)();

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.frequency.value = 1200;
        gain.gain.value = 0.15;

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.15);
      } catch (error) {
        // Sound is optional; scanning can continue.
      }
    }

    function sendBarcodeToBilling(code) {
      const message = {
        source: "CRACKERS_BARCODE_SCANNER",
        type: "BARCODE_SCANNED",
        barcode: code
      };

      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(message, "*");
        sendStatus.textContent = "Barcode sent to billing tab.";
      } else {
        sendStatus.textContent =
          "Billing tab connection not found. Keep the billing tab open and launch the scanner from there.";
      }
    }

    function handleScanSuccess(decodedText) {
      if (!scannerRunning) return;

      const code = String(decodedText).trim();
      if (!code) return;

      const now = Date.now();

      // If locked, record that a barcode is still being detected.
      // Do not add another product.
      if (scanLocked) {
        lastBarcodeDetectedAt = now;
        return;
      }

      // Lock immediately before sending the barcode.
      scanLocked = true;
      lastBarcodeDetectedAt = now;

      barcodeValue.textContent = code;
      resultBox.style.display = "block";

      beep();
      sendBarcodeToBilling(code);

      setStatus(
        "Product added once. Remove the barcode from the camera view for 1.5 seconds before scanning the next product."
      );
    }

    function handleScanMiss() {
      if (!scannerRunning || !scanLocked) return;

      const now = Date.now();
      const timeWithoutBarcode = now - lastBarcodeDetectedAt;

      // Unlock only after 1.5 continuous seconds without detection.
      if (timeWithoutBarcode >= UNLOCK_DELAY_MS) {
        scanLocked = false;
        lastBarcodeDetectedAt = 0;

        setStatus("Ready for the next barcode.");
      }
    }

    async function startScanner() {
      if (scannerRunning) return;

      if (typeof Html5Qrcode === "undefined") {
        setStatus(
          "Scanner library did not load. Check your internet connection and reload this page."
        );
        return;
      }

      try {
        setStatus("Requesting rear camera permission...");

        scanner = new Html5Qrcode("reader", {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.QR_CODE
          ],
          verbose: false
        });

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 280, height: 150 },
            aspectRatio: 1.5
          },
          handleScanSuccess,
          handleScanMiss
        );

        scannerRunning = true;

        scanLocked = false;
        lastBarcodeDetectedAt = 0;

        startButton.disabled = true;
        stopButton.disabled = false;

        setStatus(
          "Rear camera is running. Point it at a product barcode."
        );

      } catch (error) {
        scannerRunning = false;

        startButton.disabled = false;
        stopButton.disabled = true;

        setStatus(
          "Camera error: " +
          (error && error.message ? error.message : String(error)) +
          ". Check camera permission and try again."
        );
      }
    }

    async function stopScanner() {
      if (!scanner || !scannerRunning) return;

      try {
        await scanner.stop();
        await scanner.clear();
      } catch (error) {
        console.log(error);
      }

      scanner = null;
      scannerRunning = false;

      scanLocked = false;
      lastBarcodeDetectedAt = 0;

      startButton.disabled = false;
      stopButton.disabled = true;

      setStatus("Scanner stopped.");
    }

    async function returnToBilling() {
      await stopScanner();

      if (window.opener && !window.opener.closed) {
        window.opener.focus();
        window.close();
      } else {
        setStatus(
          "Scanner stopped. Please switch back to your Agent Billing tab."
        );
      }
    }

    window.addEventListener("beforeunload", function() {
      if (scanner && scannerRunning) {
        scanner.stop().catch(function() {});
      }
    });
  </script>
</body>
</html>
